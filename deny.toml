# Configuration de cargo-deny : https://embarkstudios.github.io/cargo-deny/

[graph]
# Ne résout les dépendances que pour les plateformes distribuées.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

[advisories]
# Les crates non maintenues ne sont signalées que si ce sont des dépendances
# directes du workspace : les dépendances transitives (ex. la pile GTK de Tauri
# sous Linux) sont hors de notre contrôle.
unmaintained = "workspace"
ignore = []

[licenses]
# minim est un logiciel propriétaire : licences permissives uniquement, plus
# MPL-2.0 (copyleft au niveau fichier, compatible avec une distribution
# propriétaire tant que les fichiers sous MPL ne sont pas modifiés).
# GPL/LGPL/AGPL sont refusées.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8
# La liste autorisée est une politique, pas un inventaire de l'arbre actuel.
unused-allowed-license = "allow"

[licenses.private]
# Les crates du workspace ne sont pas publiées et n'ont pas de licence.
ignore = true

[bans]
# L'arbre de dépendances de Tauri contient de nombreuses versions en double ; à traiter plus tard.
multiple-versions = "allow"
wildcards = "deny"
# Les dépendances par chemin entre crates du workspace n'ont pas de contrainte de version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
