[package]
name = "minim-core"
description = "minim domain model and workflow engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
serde.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }
ulid.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[features]
# Dérive les types TypeScript (ts-rs) des types échangés avec l'interface.
# `no-serde-warnings` : ts-rs ne lit pas `serde(try_from, into)`, utilisés par
# les types déjà exportés en `string` (identifiants, `FieldName`, `Template`).
ts = ["dep:ts-rs", "ts-rs/chrono-impl", "ts-rs/no-serde-warnings"]

[lints]
workspace = true
