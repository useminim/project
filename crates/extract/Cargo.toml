[package]
name = "minim-extract"
description = "minim document readers and converters (PDF with PDFium)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Processus PDFium lancé par les tests (l'application, elle, se relance avec
# l'argument --pdf-worker).
[[bin]]
name = "minim-pdf-worker"
path = "src/bin/minim-pdf-worker.rs"

[dependencies]
chrono.workspace = true
image.workspace = true
minim-core.workspace = true
pdfium-render.workspace = true
sysinfo.workspace = true
thiserror.workspace = true

[dev-dependencies]
minim-core = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
