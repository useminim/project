[package]
name = "minim-desktop"
description = "minim desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# Le suffixe `_lib` distingue le nom de la bibliothèque de celui du binaire,
# voir https://github.com/rust-lang/cargo/issues/8519
name = "minim_desktop_lib"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
chrono.workspace = true
keyring-core.workspace = true
minim-core.workspace = true
minim-extract.workspace = true
minim-store.workspace = true
serde.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store.workspace = true

[dev-dependencies]
minim-core = { workspace = true, features = ["test-support", "ts"] }
# Runtime simulé, pour tester les commandes avec la vraie capability.
tauri = { workspace = true, features = ["test"] }
serde_json.workspace = true
tempfile.workspace = true
ts-rs.workspace = true

[lints]
workspace = true
