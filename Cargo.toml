[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
# Crates internes
minim-core = { path = "crates/core" }
minim-extract = { path = "crates/extract" }
minim-shared = { path = "crates/shared" }
minim-store = { path = "crates/store" }

# Desktop
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }

# Modèle métier
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = "3"

# Stockage local chiffré (D-31)
getrandom = "0.4"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
rusqlite_migration = "2"
zeroize = "1"
# Trousseau du système : un store par OS (D-31).
apple-native-keyring-store = { version = "1", features = ["keychain"] }
keyring-core = "1"
windows-native-keyring-store = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

# Lecture des PDF (D-34) : les binaires PDFium sont fournis par
# scripts/fetch-pdfium.mjs.
pdfium-render = { version = "0.9", default-features = false, features = ["pdfium_latest", "thread_safe"] }

# Logs et diagnostics
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Génération des types TypeScript
ts-rs = "12"

# Tests
proptest = "1"
tempfile = "3"

# Empreinte des fichiers (D-33)
sha2 = "0.11"

# Correspondance des déclencheurs
regex = "1"
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Autorisés dans les tests via `clippy.toml`.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
# `panic = "abort"` n'est volontairement pas défini : le déroulement de pile
# permet à une tâche qui panique (ex. un parseur tiers sur un document malformé)
# d'échouer sans arrêter toute l'application.
